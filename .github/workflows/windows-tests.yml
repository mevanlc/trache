name: Windows tests

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      # Several integration tests intentionally exercise the process-wide
      # Recycle Bin. Keep them serial so listing and metadata reads cannot race
      # another test's restore or purge operation.
      - name: Test trache on Windows
        run: cargo test --all --no-fail-fast -- --test-threads=1

      # trash-patched is a path dependency rather than a workspace member, so
      # its native Windows unit and doctest suite needs an explicit invocation.
      - name: Test patched trash library on Windows
        if: always()
        run: cargo test --manifest-path trash-patched/Cargo.toml --no-fail-fast -- --test-threads=1
